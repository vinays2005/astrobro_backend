name: tests

# Runs the whole backend test suite on every push and pull request. The suite needs no API keys or
# network access (LLM and vector-database calls are stubbed). Railway waits for this check to pass
# before it deploys a commit, so a broken commit never replaces the working server.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
