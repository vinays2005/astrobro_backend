[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "astrobro-backend"
version = "1.0.0"
description = "AstroBro — AI Vedic Astrology Backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# Only bare _ is a throwaway — private helpers get linted too
dummy-variable-rgx = "^_$"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
