services:
  - type: web
    name: astrobro-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      # --- Non-secret config (safe to commit) ---
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_NAME
        value: AstroBro AI
      - key: AYANAMSA
        value: LAHIRI
      - key: HOUSE_SYSTEM
        value: W
      - key: DASHA_SYSTEM
        value: vimshottari
      - key: VECTOR_DB
        value: qdrant
      - key: BOOKS_COLLECTION
        value: vedic_books
      - key: SPECIALIST_COLLECTION
        value: specialist_books
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: RERANKER_ENABLED
        value: "false"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_CLASSIFIER_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_REPORT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-20b
      - key: LLM_FALLBACK_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_FALLBACK_MODEL
        value: gemini-flash-lite-latest
      - key: FIREBASE_PROJECT_ID
        value: astro-bro-96380
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AUTO_APPROVE_PAYMENTS
        value: "false"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      # --- Secrets: paste these values in the Render dashboard manually ---
      - key: SECRET_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
