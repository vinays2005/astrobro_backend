version: "3.9"

services:
  # AstroBro FastAPI backend
  astrobro:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data       # persist chroma + sqlite
      - ./books:/app/books     # PDF books
      - ./.env:/app/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # Ollama — local LLM runtime
  # GPU passthrough: add `deploy.resources.reservations.devices` for NVIDIA
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:
